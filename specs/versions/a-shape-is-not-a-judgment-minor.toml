  { id = "kb-write-revision", desc = "core/scripts/store.py:554-601 and cli/flw.py: `flw kb write --revision REV` writes the key into the note's frontmatter. The surface line is already in the contract, written at spec time, so the parser-surface check holds the two together. Say in `flw kb write --help` what the field is for, beside the rule about recording what was measured." },
  { id = "revision-tests", desc = "tests/test_store.py: a note whose revision is a sentence is still reported; one whose revision is a plausible sha is not; `flw kb write --revision` puts the key in the file and the note then clears the row. Verify each by reverting its own change.", depends_on = ["revision-shape", "kb-write-revision"] },
