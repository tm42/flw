  { id = "context-md", desc = "core/shared/context.md: a short section — the three stores and the one sorting question, the walk-up as the read pattern, that flw context prints none of it on purpose.", depends_on = ["know-command", "map-command"] },
  { id = "research-skill", desc = "core/skills/flw-research/SKILL.md: §1 — with [project.roots] declared the survey is every member, parent pass first, and the parent gets a shared.md as well as system.md; §4 — the knowledge tree written per level and reviewed per level, the bar and the earns-its-tokens sentence, the [knowledge] dir key proposed from what the repo already ignores, `flw know --stamp` for every file written and `--reindex` at the end, the migration sentence for a kb repo-root note that describes architecture, and the toy example named as the shape to imitate. The table of what goes where gains the store's row.", depends_on = ["know-command"] },
