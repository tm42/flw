[[decisions]]
topic = "whether a check's exit code may identify one this session cannot run"
options = [
  "Keep exit 127 and guard it: classify unavailable only when the command own first token does not resolve, which fixes npm run and leaves cargo misreported.",
  "Delete automatic detection. A check this session cannot run is one the project declared in [tests] yours, and nothing is read from an exit code.",
  "Keep it as it stands and narrow the contract claim to match.",
]
chosen = "Delete automatic detection."
rationale = """
Measured: a missing binary exits 127, `cargo <bad-subcommand>` exits 101, `npm run <script>`
exits 127 when a devDependency is absent. So the same code carries both meanings inside one
project — tsc was installed so its failure is a failure, vitest was not so its 127 is
"yours" — and cargo returns 101 for a missing subcommand and a compile failure alike, which
no guard can separate. 127 identifies an unrunnable check only when the check is a bare
binary path, which is what flw's own checks are and what almost nothing else is.

This reverses a recorded decision. specs/versions/v2.0.toml:93 reads "Exit 127 detects it
automatically; [gates] yours declares it when it is known in advance." The declaring half
was right and stands. The automatic half never fires outside this repository's shape, and
its failure mode is the worst available: `flw test` exits 0 while a test suite did not run.

The guarded variant was the tempting one and it buys a half-fix. It corrects npm and leaves
cargo, go, mvn, gradle and dotnet reporting a check that cannot run as one that failed,
which is the direction that at least fails loudly — but it keeps a mechanism whose contract
claim would have to be narrowed to a sentence about bash's exit conventions. A declaration
is one line in a file the project already has. An automatic answer that is wrong is a green
run that proved nothing.
"""

[[decisions]]
topic = "what flw validate does in a repository that has flw configuration and no contract"
options = [
  "Exit 0, saying the project has no contract yet.",
  "Keep exit 2 and improve the message — a run that proved nothing is what 2 means.",
]
chosen = "Exit 0."
rationale = """
run_tests.py:79-81 already calls local [tests] checks with no specs/ a normal, supported
state, and records fixing the same crash for flw test. flw validate is the second of four
commands the README puts in front of a newcomer, and a repository flw-research just
configured is exactly where they will run it.

Exit 2 is defensible — the run did prove nothing — and it reads as failure to anything that
checks the code, which is what a newcomer's CI does. Nothing is wrong in that repository, so
nothing is reported. The surface sentence gains the distinction rather than losing it: 2
still means a file that was given and could not be checked.
"""

[[decisions]]
topic = "whether the scouts grow a third language"
options = [
  "Add a Rust scout.",
  "Decline to run when the majority language is unsupported.",
  "Run, and print what was not read.",
]
chosen = "Run, and print what was not read."
rationale = """
The two shipped scouts cost nothing because the parser is already there: Python's ast ships
with the interpreter flw already requires, and the TypeScript compiler sits in the target
repo's own node_modules. Rust has no equivalent — rustc exposes no stable AST to a script —
so a third scout means syn or tree-sitter, a runtime dependency the contract refuses.
specs/versions/v3.0.toml:93 drew this line already: "these two because they cost nothing,
everything else defers to aider."

Declining in the mixed case throws away a correct result. The ranking of four Python files
under tools/ is accurate about tools/, and an engineer working there is well served by it.
What makes it dangerous is not that it is wrong but that it is unlabelled, while
flw-research makes scout step 1 and says to read its output before opening any file. A file
count fixes that, holds for every language that will ever exist, and adds no parser.
"""
