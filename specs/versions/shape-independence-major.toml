[[dag]]
group = 3
phase = "an import edges to the module it named"
tasks = [
  { id = "py-source-roots", desc = "core/scripts/scout.py:201 _source_roots scans one directory level below the scan root, so a monorepo has none and every module ends up known as libs.core.src.mono_core — a name no import can spell, which is why every absolute import falls to the name branch. Derive the roots from the files instead: walk up from each source file while __init__.py exists and add the parent of the topmost package. The scan root stays in the list." },
  { id = "py-import-target", desc = "core/scripts/scout.py:338-350 computes target for an ImportFrom and then discards it for the name case, writing seen[alias.name] += 1. Carry it: key facts.imports by (target, name) so the edge loop knows which module the import named. The submodule branch just above, which routes `from . import config` into mods, is unchanged.", depends_on = ["py-source-roots"] },
  { id = "py-prefer-target", desc = "core/scripts/scout.py:443-449 edges to every file in definers[name]. Prefer the definer whose module is the target the import named, and fall back to every definer only when none matches. The fallback is not a convenience — it is what keeps the re-export barrel property, because a barrel defines nothing, so the intersection is empty there and the score still reaches the definition.", depends_on = ["py-import-target"] },
  { id = "mjs-import-target", desc = "core/scripts/scout.mjs:211 already computes target: resolveSpec(...) into specs, and the definers loop at :263-273 ignores it, using names alone. Carry the target alongside each name into importsOf so the same preference is available.", depends_on = [] },
  { id = "mjs-prefer-target", desc = "core/scripts/scout.mjs:263-273: same preference and same fallback as py-prefer-target. In TypeScript the collision arrives through `export interface Props` per component, which is ordinary React, so twenty components sharing the name rank within 3% of each other whether or not anything imports them.", depends_on = ["mjs-import-target"] },
  { id = "mjs-tsconfig-paths", desc = "core/scripts/scout.mjs:143-156 resolveSpec treats a bare specifier as internal only when its first segment names a top-level directory, so @/lib/types resolves to nothing and :212-221 then counts @/lib as a package. Read compilerOptions.paths through the compiler already loaded — ts.readConfigFile — and consult it in both places. v4.3 recorded this as fixed and tests/test_scout_mjs.py:138 asserts it using shared/util, the baseUrl-relative form, which never exercises @/; that test stays and a new one covers the alias.", depends_on = ["mjs-import-target"] },
  { id = "guard-collisions", desc = "tests/: a fixture where one name is defined in several packages edges only to the package the import named; the barrel fixture still ranks the definition and never the barrel; an aliased import produces an edge and does not appear under external dependencies. Run the whole scout suite — the prototype of this change passed all 40 unchanged, and the only movement in flw's own output was cli/flw.py leaving MOST DEPENDED ON, which is its own collision being corrected.", depends_on = ["py-prefer-target", "mjs-prefer-target", "mjs-tsconfig-paths"] },
]

