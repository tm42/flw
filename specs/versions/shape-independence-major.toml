  { id = "scout-help-sections", desc = "cli/flw.py scout epilog (~:2150) documents ENTRY POINTS, BUILT ON, PACKAGES, DEPENDS ON, CYCLES, MOST DEPENDED ON. The TypeScript scout prints PACKAGES, EXTERNAL DEPENDENCIES, DEPENDS ON, CYCLES, MOST IMPORTANT EXPORTS — three names differ and ENTRY POINTS has no counterpart at all. The epilog also says PACKAGES is ordered by rank; scout.mjs:337 sorts by file count and prints no rank. Say which scout prints what, or converge the two; do not leave the help describing one of them." },
  { id = "scout-no-ts-message", desc = "cli/flw.py:1939-1944 and core/scripts/scout.mjs:165: the no-typescript message names npm install in a repo that may use pnpm or yarn, where it creates a competing node_modules and a second lock file; suggests scouting the Python side in a repo with no Python; and quotes a noop.js path that does not exist, being a createRequire artefact. Name the package manager from the lock file present, drop the Python sentence when the tree holds none, and keep the module-resolution error without the fictional path." },
]

