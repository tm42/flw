name         = "shape-independence"
base         = "validate-the-move"
spec_version = "0.7.4"
summary      = "stop inferring an unrunnable check from an exit code, fold a release number for a project with no history, edge an import to the module it named, and say what a scout did not read"

approach = '''
WHAT THIS IS. Four reviewers each built a repository unlike flw's own — a twelve-package
Python monorepo, four Python service repos with one feature spanning three of them, a
TypeScript frontend with tsconfig aliases and barrels, and a Rust service with Python
tooling — and ran flw inside it. 3 CRITICAL, 8 MAJOR, 9 MINOR. The consolidation is at
.flw/reports/2026-08-27T-adopt.md and the four raw reports beside it. This version closes
all twenty.

Three of the findings are one shape. A mechanism is correct in exactly this repository and
silent everywhere else, because this repository is the only long-running subject flw has
ever been tested against.

  exit 127 as "cannot run here"   works because flw's checks are absolute paths
  the release fold                works because applied opens with a legacy 4.0 anchor
  resolving an import by name     works because flw has 17 collisions across 383 names

Measured, not reasoned: a missing binary exits 127, `cargo <bad-subcommand>` exits 101, and
`npm run <script>` exits 127 when a devDependency is absent — so the same code means "yours"
and "failed" in one project. expected_release returns None for any applied list with no
legacy entry, including one whose first record declares a release_line, so no repository
adopting flw today has its version checked at all. Across four service repos with zero
cross-repo imports, 5 of 54 name edges cross a repository boundary; in a twelve-package
monorepo `packages/gateway` imports four things and scout prints seven package edges, a
cycle over all twelve, and ten identical `Config 33 files` rows.

WHAT THIS IS NOT.

Not a change to the ranking model. PageRank, uniform edge weights, damping as the only
constant — all of it stands. What changes is which file an edge lands on when more than one
defines the name, and the fallback to every definer stays, because that is what keeps a
re-export barrel taking none of the score. A prototype of exactly this change ran flw's own
40 scout tests green and printed 18 package edges matching grep one for one.

Not a third scout. Python's ast ships with the interpreter and the TypeScript compiler sits
in the target repo's node_modules; Rust has no equivalent short of a runtime dependency the
contract refuses. The scouts learn to count what they did not read, which is a file count
and costs nothing per language.

Not a multi-root or per-package project model. nearest_project keeps its single-root rule
and `flw test` gains no selector. What changes is that a run says which root it resolved,
so a command issued from the wrong directory is visible instead of being answered by an
ancestor.

Not a fix for a service already in production. A repository shipping 2.4.0 can declare line
2 and become 2.0.0, or keep line 0 and become 0.2.5, and neither is what it ships. The fold
opt-out that would settle it stays deferred; this version makes the fold run at all, which
is what turns that from invisible into a question worth asking, so it becomes an open
question in the contract rather than a task here.

WHAT WAS NOT REVIEWED. No reviewer ran flw-spec or flw-execute end to end — both are
interviews and need a human. `flw install` was run only as --dry-run and nothing was written
outside the scratch trees. A mixed Python/TypeScript monorepo was not tested, and neither
was Windows or any host but claude-code, the only one on the machine.
'''

contract_edit = '''
In [[final_state.components]] "validation and checks":

REPLACE the provides sentence beginning "A check this session cannot run is handed back"
with:
  "A check this session cannot run is handed back as the user's to run when the project
  declared it so, and a full run that had to hand one back does not report success, because
  the definition of done was not demonstrated. Nothing is inferred from a check's exit
  code: no code distinguishes a command that is absent from one that ran and failed."

ADD to the same provides list:
  "A project that has never carried a legacy version number folds its release from its
  first record, so the check is live on the day flw is adopted rather than only in a
  repository with history."
  "A run of the full definition of done in a directory with no contract to read says so
  rather than reporting success."
  "A scout says what it did not read: files in languages neither scout parses are counted
  and named, so a ranking of the minority language in a mixed repository is never mistaken
  for the repository."
  "A user is told which project root a command resolved to before it runs, so one issued
  from the wrong directory is visible rather than silently answered by an ancestor."

REPLACE the properties sentence beginning "A check reported as one this session could not
run is one whose own command was missing." with:
  "A check reported as one this session could not run is one the project named in [tests]
  yours."
Keep the sentence that follows it about a failing [tests] setup, unchanged.

REPLACE the properties sentence beginning "Both scouts rank the file that defines an
imported name" with:
  "Both scouts rank the file that defines an imported name rather than the file a specifier
  names. Where more than one file defines that name, the edge goes to the definer in the
  module the import actually named, and to every definer only when no module resolves — so
  a re-export barrel still takes none of the score, and a name defined once per package
  does not edge to every package."

ADD to properties:
  "The release fold is computed for any applied list, including one naming no legacy
  numbered record, so a declared release number is checked from a project's first record
  onward."

In [[final_state.components]] "the flw CLI", surfaces:

REPLACE the exit-code line with:
  "Exit codes: 0 success, 1 something failed or was refused. `flw test` also uses 2 for a
  run that proved nothing — nothing declared to run, nothing left runnable here, a full run
  with a check the project handed back, or a full run with no contract to read. `flw
  validate` uses 2 for a file it was given and could not check, and 0 for a project that
  has no contract yet, which is a state and not a fault."

In assumptions:

REPLACE "Some of a project's checks cannot run in an agent's session — no network, no
database, no browser. Handing those back is the normal case, not a degraded one." with the
same sentence plus:
  "Which ones is the project's to declare, because no exit code identifies them."

In open_questions, ADD:
  "Whether a project already in production can express the release number it actually
  ships. Declaring a line restarts major and minor at zero, so a service at 2.4.0 becomes
  either 2.0.0 or 0.2.5, and neither is true; the fold opt-out that would settle it is
  deferred."
'''

[[dag]]
group = 1
phase = "the check runner stops guessing"
tasks = [
  { id = "delete-unavailable", desc = "core/scripts/run_tests.py: delete UNAVAILABLE (:33) and the 127 branch in Result.state (:51-54), so state is pass or fail. Every reader of the unavailable state goes with it: the mark table at :167, the blank seconds at :170, the message at :172-173, and the count at :185. The [yours] rows printed from the declared skipped list stay exactly as they are — that is the surviving mechanism, not a casualty of this task." },
  { id = "test-exit-codes", desc = "cli/flw.py test(): with no result ever unavailable, re-derive the exit codes from what remains and make them agree with the surface sentence this version rewrites. A failure is 1. The full-run hand-back that returns 2 now fires only from checks the project declared in [tests] yours. Read the whole block before editing it; two of the three exit-2 paths are in the handler and one is in the collector.", depends_on = ["delete-unavailable"] },
  { id = "execute-127-prose", desc = "core/skills/flw-execute/SKILL.md:179-180 says two kinds of check are handed back automatically, one of them being exit 127. Delete the 127 half. What replaces it: nothing is inferred from an exit code, and a check the session cannot run is proposed for [tests] yours, which the step below it already tells the agent to do.", depends_on = ["delete-unavailable"] },
  { id = "guard-127-is-failure", desc = "tests/: a check whose command does not exist is reported as failed and counted as a failure, not handed back. This is the mutation guard for the phase — reinstating the 127 branch must fail it by name.", depends_on = ["delete-unavailable"] },
]

[[dag]]
group = 2
phase = "a run says where it is"
tasks = [
  { id = "test-prints-root", desc = "cli/flw.py test(): print the resolved project root before running anything. Two findings collapse into this one line — a repo with no specs/ and no .flw/ silently running an ancestor's checks, and `flw test -A packages/billing` walking up from that path and running the whole tree. flw validate already gives itself away by printing each target's absolute path; test prints none at any verbosity." },
  { id = "test-a-needs-contract", desc = "cli/flw.py test(): refuse --all when specs/current.toml does not exist, naming the path, exit 2. -A is the contract's full definition of done and currently returns 0 having never looked for a contract. Plain `flw test` is untouched, so a repo flw-research configured with local checks and no specs/ keeps working — that case is deliberate and run_tests.py:79 records it.", depends_on = ["test-exit-codes"] },
  { id = "validate-no-contract", desc = "cli/flw.py validate(): with no path argument and no specs/current.toml, say the project has no contract yet and exit 0. See the decision in this record. The same message names the loop that validates a tree split by service, because flw validate reads one specs/ and a monorepo split as plans/design-v3.md:568 prescribes has no repository-wide validate." },
  { id = "guard-root-and-contract", desc = "tests/: the resolved root appears in flw test output; --all in a directory with .flw/ and no specs/ exits 2; validate in the same directory exits 0 and says so.", depends_on = ["test-prints-root", "test-a-needs-contract", "validate-no-contract"] },
