name         = "quiet-wrongness"
base         = "a-solo-review-fills-the-store"
spec_version = "0.12.1"

summary = """
Fix what two review rounds found: a stored revision that steers git instead of naming a \
commit, checks that report a pass having run nothing, commands that traceback where they \
should name a file, and eleven places where two sentences of the shipped tree instruct \
opposite things.
"""

approach = """
Two rounds ran over the whole tree at 999b329. An `eng` team of four code lenses filed 1
CRITICAL, 11 MAJOR and 9 MINOR (.flw/reports/2026-09-02T2347-eng.md). A `craft` team of
five prose lenses filed 1 CRITICAL, 24 MAJOR and 25 MINOR
(.flw/reports/2026-09-03T0715-craft.md). This record carries the corrections from both.

**What this is not.** It adds no capability. Three findings that would add one are
deliberately held for the next record, which will be major: a `flw style lint` command
over the mechanical rules; a mechanism that derives one copy of a duplicated fact from
another at check time; and pricing a run rather than a file in budget.py. Two more are
outside flw entirely and are the user's: a UserPromptSubmit or Stop hook, and whether
`.flw/reviews/craft.toml` is tracked.

**Also deliberately held: the terse_prose.md restructure.** voice measured that 21% of
that file (27 lines, 1,934 bytes) is script-checkable, that all 32 of its bolded rules
are in the other 79%, and that 1,039 of the checkable bytes sit in its last section. The
reorder-and-bold fix waits for research into how the three hosts deliver style at all,
because that research can change what the file should say and rewriting it twice is the
churn a record exists to prevent. What this record does fix is the four rules whose text
is measurably wrong, which is true whatever the delivery turns out to be.

**Measurements to carry, because they cannot be re-derived by reading.** 226 mechanical
style violations exist in the tree today: 18 of 45 untagged fences and 12 two-column
tables and 8 over-long lines in 21 authored files, 97 of 174 untagged fences and 41
headings deeper than ### and 46 over-long lines in 55 reports. The four skill openings
cost about 157,000 bytes and 39,000 tokens before the first line of work. A four-lens
dispatch is 94,276 tokens before reading any code, against the ~57,000 team-dispatch.md
claims. The contract was 9,787 tokens at f1a2f60 and 10,095 at 999b329, 3.1% in one day.
212 mutations across eight engines left 8 survivors, all in flw context --scope and
budget.py, the two newest files.

**What the rounds did not cover, so the next round starts here.** No skill was executed
in a host — the-run followed each SKILL.md as text, which is one agent's reading and not
a host's loading. flw install, uninstall, sync and update were left alone by every lens
because attacking them writes into host configuration. docs/index.html, plans/ and the
46 records as prose are unread. No mutation was applied to a test file. Every token
number is cl100k_base and reads 5-8% below the real tokenizer.

**Order matters in one place only.** Phase 6's budget.py change adds two files to a
declared check, and one of them, core/shared/commits.md, is edited in phase 4. Running
phase 6 first would hold a file to a ceiling before its final size exists.
"""

contract_edit = """
Six changes, all in final_state.components.

1. **the flw CLI, properties.** No change. install and sync returning 1 on a refusal is
   already what the exit-code surface claims — "0 success, 1 something failed or was
   refused" — so that task brings the code to the contract rather than the reverse.

2. **validation and checks, properties.** REPLACE:

     "A command that could not be run to completion is never reported as passing: a
     check whose text spans more than one line is refused at collection time rather than
     reported by its last line's exit code."

   with:

     "A command that could not be run to completion is never reported as passing: a
     check or a setup line holding a command separator bash would score by its last
     command — a newline or a `;` — is refused at collection time naming the separator
     found, while `&&` and `||` are left alone because they are what a user writes
     deliberately. A `checks` or `yours` that is not a list of strings is refused naming
     the file and the key, rather than iterated into one check per character."

3. **validation and checks, properties.** APPEND a new property:

     "`flw test -A` means the contract's definition of done, so a contract declaring no
     tests is exit 2 naming success_criteria.tests rather than a silent fall through to
     the branch set. The fall through stays for the plain call, where the branch set is
     what was asked for."

4. **validation and checks, properties.** APPEND a new property:

     "A version record flw ledger cannot parse is named on stderr with the count and the
     first path, the way the note store names a note it could not read, rather than
     dropped from the corpus at exit 0; --show on such a record reports the error and
     exits 1."

5. **the knowledge store, properties.** APPEND to the staleness property, after
   "...and is checked in each member's repo.":

     "A recorded revision reaches git as a revision and never as an option, so a
     frontmatter value beginning with `-` fails the diff rather than steering it."

6. **the skills, provides.** APPEND a new sentence:

     "A user can run flw-research on a repository that has no flw directory yet, which is
     the ordinary case for a repo nobody set up: the skill says which directory it is
     about to create and gets a yes before writing, the same gate flw-spec already
     applies to specs/, and proposes the ignore lines alongside the config it writes."

7. **validation and checks, implementation.** REPLACE, in the paragraph stating the
   ceilings:

     "20,000 bytes for each core/skills/*/SKILL.md"

   with:

     "21,000 bytes for each core/skills/*/SKILL.md"

   The rest of that paragraph is unchanged, including the 10,000 for
   core/shared/context.md and core/styles/terse_prose.md and the bytes-rather-than-tokens
   sentence.

Nothing else moves. The style file's four rule fixes, the eleven skill-prose fixes and
the three test additions are all changes to documents the contract does not quote, so
they carry no contract edit.
"""
# --------------------------------------------------------------------------- #

[[decisions]]
topic     = "Where the SKILL.md ceiling sits, now that this record needs the file to grow"
options   = [
  "21,000 bytes",
  "22,000 bytes",
  "hold 20,000 and move flw-execute sections 5 and 6 into a reference",
]
chosen    = "21,000 bytes"
rationale = """
review-opens-solo set 20,000 with flw-execute at 19,461 and said so deliberately: "a
ceiling that does not bite is not a ceiling. A record that needs the file to grow argues
for raising the number, which is the conversation the check exists to force." This is
that conversation, arriving as designed. The five additions this record makes to
flw-execute are 1,023 bytes, already compressed from 1,625, and each closes a gap a
reviewer hit while running the skill; getting under the remaining 539 means dropping the
failure mechanism from each rule, which is the one thing this record argues makes a rule
stick. 21,000 leaves flw-execute 516 bytes and flw-research 1,304, so the next paragraph
added still fails and the property that made 20,000 right survives. 22,000 was already
rejected as "giving every file room", and current-maximum-plus-10% as the same. Moving
flw-execute sections 5 and 6 into a reference is the better long answer and is a
restructure, so it belongs in the major record that follows this one.
"""

[[decisions]]
topic     = "Where the phase-boundary check requirement lands"
options   = [
  "the checks run at least as often as a commit is proposed, never less often",
  "commits.md's requirement is scoped to whoever makes the commit, not the run that proposes it",
  "leave the contradiction and note it",
]
chosen    = "the checks run at least as often as a commit is proposed, never less often"
rationale = """
commits.md test 2 is "Every declared check passes at this commit. A red commit poisons
git bisect for everything after it", and flw-execute proposes a commit at every phase
boundary while running the checks only after the last phase. On a four-phase version
that is three commits proposed with nothing having run. Scoping the requirement to the
committer was the cheaper fix and it fails: the user commits what the run proposed, so
the requirement lands on someone who was never told to run anything. The cost is real
and is the reason this was a fork — a four-phase run now pays four check runs, which is
32 seconds in flw and could be minutes elsewhere. Recorded rather than hidden: a project
whose suite is too slow for this should say so in its own extension.
"""

[[decisions]]
topic     = "How a dispatched reviewer gets the contract narrowed to its scope"
options   = [
  "change the instruction to flw context --scope, with no skill named",
  "make --scope suppress the shared context in cli/flw.py",
  "leave it, and pay context.md per reviewer",
]
chosen    = "change the instruction to flw context --scope, with no skill named"
rationale = """
Naming a skill is what makes flw context print core/shared/context.md, and a dispatched
reviewer runs no flw skill: the orchestrator resolved the root and passes the result.
Measured, `flw context --scope .` is 9,108 tokens against 11,341 for
`flw context flw-review --scope .`, so the difference is 2,233 per reviewer — 8,060 on a
four-lens run and 10,075 on the five-lens round that found it. Changing the code so
--scope suppresses the section would fix it for everyone but changes a documented
behaviour of a command, which is a major change, and this record is minor. The
instruction is prose and the fix is one word. The reviewer still needs the project's
extension file, so team-dispatch.md says to hand it over separately.
"""

[[decisions]]
topic     = "Whether numstat should validate the revision or pass it end-of-options"
options   = [
  "git diff --numstat --end-of-options <rev> -- <path>",
  "refuse a frontmatter revision matching ^-",
  "both",
]
chosen    = "git diff --numstat --end-of-options <rev> -- <path>"
rationale = """
--end-of-options is git's own answer to this, needs git 2.24 or later, and makes the
injected value fail as `fatal: bad revision` while a real revision behaves unchanged —
verified against git 2.50.1 in both directions. A regex refusal would be a second,
weaker copy of the same rule that git already implements correctly, and it would have to
guess which shapes are dangerous. The three tests that assert the exact argv move with
the change, which is what makes the fix reviewable rather than silent.
"""

[[decisions]]
topic     = "Which style-file findings this record fixes"
options   = [
  "the four rules whose text is wrong",
  "all five, including the reorder-and-bold restructure",
  "none, hold the whole lens for the styling research",
]
chosen    = "the four rules whose text is wrong"
rationale = """
The fence-tag rule, the width rule's scope, the two-column table wording and the
heading-depth exception are wrong regardless of how a host delivers the file, so fixing
them cannot be invalidated by the research that follows. The restructure — moving the 27
checkable lines to the top and bolding them — is a bet about what makes a rule stick,
and the evidence for it is n=1: the trailing-spaces rule is the only one stated with its
failure mechanism and the only one with zero violations in 757,732 bytes. That is a
hypothesis worth acting on after the research, not before it.
"""

# --------------------------------------------------------------------------- #

[[dag]]
group = 1
phase = "a stored revision cannot steer git, and research can open a repo that has no flw directory"

  [[dag.tasks]]
  id   = "end-of-options"
  desc = """
  core/scripts/knowledge.py numstat: pass --end-of-options before the revision, so
  `git diff --numstat --end-of-options <rev> -- <path>`. Today a frontmatter revision of
  `--output=/tmp/x` makes flw know --check exit 0, print `current` for a file whose
  subject lost nine of ten lines, and write /tmp/x from the command whose contract
  property is "writes nothing"; -U0 and --stat return wrong-but-plausible counts. Update
  the three tests that assert the exact argv:
  test_the_diff_runs_against_the_mirrored_path_in_the_file_s_own_repo,
  test_system_md_is_checked_once_per_member_in_that_member_s_own_directory,
  test_a_module_file_mirrors_the_file_it_describes_and_orphans_with_it.
  """

  [[dag.tasks]]
  id   = "research-can-start"
  desc = """
  core/skills/flw-research/SKILL.md, at the top of section 4: add the paragraph
  flw-spec already carries at its lines 56-59, with `.flw/` for `specs/`. A repo nobody
  set up has neither specs/ nor .flw/, which is the only kind of repo this skill exists
  for, so its own opening resolves no root and step 4 tells it to read a file that
  cannot exist. Say which directory is about to be created, get a yes, then write. No
  new subcommand — the skill creates the directory, the same way flw-spec creates specs/.
  """

  [[dag.tasks]]
  id   = "research-proposes-the-ignore"
  desc = """
  core/skills/flw-research/SKILL.md section 4: propose the .gitignore lines for the flw
  directory alongside the config, in the same block shown to the user. Three places
  assume the store and the reports directory are ignored and no skill creates the
  ignore, so a fixture left ` M .flw/knowledge/tallyup.md` and `?? .flw/reports/` after
  a review that was told to change nothing.
  """
  depends_on = ["research-can-start"]

[[dag]]
group = 2
phase = "a check that ran nothing cannot report a pass"

  [[dag.tasks]]
  id   = "separator-guard"
  desc = """
  core/scripts/run_tests.py: _check and _local_config both refuse on "\\n" for the stated
  reason that bash scores a list by its last command. `;` has exactly that property and
  is not refused, so `checks = ["false; true"]` reports a pass. Refuse on [\\n;] in both,
  keeping each message's own text and naming the separator found. && and || stay allowed;
  they are what a user writes deliberately.
  """

  [[dag.tasks]]
  id   = "checks-must-be-a-list"
  desc = """
  core/scripts/run_tests.py _local_config: refuse a `checks` or `yours` that is not a
  list of strings, naming the file and the key. Today a string is iterated per character
  — `checks = "make test"` runs nine shells, and `checks = "  "` prints `2 passed` at
  exit 0 having run nothing, which is the empty-run-reads-as-a-pass failure this file's
  comments name twice. In collect, refuse a success_criteria.tests entry that is not a
  table with a string command, naming the contract path, rather than raising KeyError.
  """

  [[dag.tasks]]
  id   = "full-run-needs-declared-tests"
  desc = """
  core/scripts/run_tests.py collect: `if (full or not branch) and declared` falls through
  to the branch set when the contract declares no tests, and success_criteria.tests is
