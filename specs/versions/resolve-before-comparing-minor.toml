  { id = "the-two-failures", desc = "Against that fixture: `flw know --stamp <a file in the store>` stamps rather than refusing, and `flw know <that same path>` is refused as inside the store rather than answering with a path under the ignored directory. Both must fail with their fix reverted — check that by reverting each, not by reading the test.", depends_on = ["symlink-fixture", "refuse-inside-store"] },
  { id = "the-four-that-work", desc = "Against the same fixture, pin that flw know, flw know <a code path>, --check and --reindex still exit 0 and print what they print on an unsymlinked repo, including the relative path in a listing. These pass today and this record must not change them; they are a regression pin, not a fail-on-revert test, and the task says so because the first draft of this record claimed they were broken.", depends_on = ["symlink-fixture"] },
  { id = "refusal-on-any-repo", desc = "tests/test_knowledge.py, without the symlink fixture: a plain repository with a real knowledge store, where naming a knowledge file's own path is refused as inside the store. This is the half of refuse-inside-store that has nothing to do with symlinks — it exits 0 today on flw's own checkout — and the record's classification turns on it, so it is pinned separately from the fixture cases.", depends_on = ["refuse-inside-store"] },
  { id = "kb-unaffected", desc = "tests/test_store.py: one test that a symlinked note root still walks, because store.walk():251 derives both sides of its comparison from the same root object. The negative half of this record's scope claim, so a later reader does not 'fix' store.py to match.", depends_on = ["stamp-resolves-store"] },
]
