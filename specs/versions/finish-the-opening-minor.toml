tasks = [
  { id = "bare-omits-context", desc = "cli/flw.py context(): print core/shared/context.md only when a skill is named. Test: bare output does not contain the file's first line; `flw context flw-spec` does.", depends_on = ["extension-read"] },
  { id = "root-provenance", desc = "cli/flw.py context(): the root line becomes `root: <path> (from $PWD — if the request named a different repository, re-run with --root)` when the root came from $PWD, and stays `(from --root)` otherwise. Test: both forms." },
  { id = "root-guard-once", desc = "cli/flw.py: the twelve-line --root guard duplicated in doctor() and context() becomes one helper both call; the comment claiming doctor prints a provenance line is deleted, because it does not. Test: both commands still refuse an empty and a nonexistent --root with the same two messages." },
  { id = "one-walk", desc = "cli/flw.py: nearest_project(start) returns project_chain(start)[-1] or None; the duplicate walk is deleted; signature and callers unchanged. Test: the existing nearest_project tests pass unchanged, plus one asserting equality over a nested fixture." },
]

