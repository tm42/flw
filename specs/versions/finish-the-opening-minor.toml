  { id = "model-prose", desc = "README.md:50, docs/layout.md:15, docs/extending.md:12, docs/install.md:108: the extension model is the chain — every project root from the outermost inward, shared.md then the skill's own file — not one directory." },
  { id = "readme-exceptions", desc = "README.md:160: the style is verified by digest and the ambient block is install-once; there are two installs flw does not re-verify, and it says which and why." },
