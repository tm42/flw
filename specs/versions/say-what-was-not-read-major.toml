  { id = "lint-tests", desc = "tests/test_style_lint.py: a missing path exits 2 and does not print clean; an unreadable file exits 2 and names it; a mix of one good target and one missing exits 2; a clean run over real targets still exits 0 and still prints clean. Verify each fails with the change reverted.", depends_on = ["lint-exit-two"] },
