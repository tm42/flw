  { id = "flwdir", desc = "In cli/flw.py's _resolve_flw_dir at :2255, guard `document.get(\"paths\", {})` the same way. This is the limb that breaks flw doctor, because it runs before _section_config does and before any handler, so a non-table [paths] in the machine-wide file takes out every command including the one a user would run to diagnose it. Use the same message shape, naming the machine-wide path.", depends_on = ["section"] },
  { id = "section-test", desc = "Add tests in tests/test_cli.py for both readers: a project config whose [paths] is a string, and a machine-wide config whose [paths] is a string, each asserting the error names the file and the section and that no traceback reaches the user. Cover one non-string non-table too — an integer, which raises TypeError rather than ValueError on the old path — so the guard is tested as a type check and not as a ValueError catch.", depends_on = ["flwdir"] },
