tasks = [
  { id = "pathspec", desc = "In core/scripts/knowledge.py, exclude the flw directory from both the diff and the untracked walk in numstat at :344, so a store in a repository that does not ignore it stops reporting itself as the change under every file it holds. numstat is `def numstat(revision: str, cwd: Path, rel: Path)` and has no parameter for this, knowledge.py imports no os, and know() at cli/flw.py:3527 is not one of the three handlers that export FLW_DIR — those are at :2362, :3421 and :3922 — so neither a literal .flw nor an environment read will do. Thread it, and the thread is longer than numstat's own callers. numstat takes what to exclude as a required keyword, supplied by changed() at :410, owed() at :452 and changed_system() at :508. Those three are not reached only from cli/flw.py: core/scripts/stale.py:220 calls knowledge.changed_system and :225 calls knowledge.changed, both inside knowledge_state() at :182, which is reached from owed() at :468 and :494, which the stale handler at cli/flw.py:3914 calls. stale.py imports no os and no CLI module, so it has nothing of its own to supply and knowledge_state() takes the keyword too. There are also 14 call sites in tests/test_knowledge.py to update. Make the keyword required at every level rather than defaulting it: any default is .flw, which is right on every machine that has not moved the directory and silently wrong on the ones that have, which is the failure class this record exists to close. The exclusion is one value and not a map even though changed_system runs per member, because the contract's flw CLI properties at current.toml:134 say the directory's name comes from the machine and never from the project. Resolve it once in cli/flw.py from the existing flw_dir_name() and pass it down. Do not derive it from store.parent.name, which is the shape that needs no new parameter anywhere and is the reason not to use it: a project that moves its store with [knowledge] dir makes that name something else and