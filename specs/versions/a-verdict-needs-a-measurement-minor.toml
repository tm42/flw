[[dag]]
group = 3
phase = "a verdict with nothing behind it"
tasks = [
  { id = "landing", desc = "In core/scripts/stale.py's landing() at :374, replace the single pickaxe with one `git log --format=%H -S <pattern> --pickaxe-regex -- <contract>` call whose pattern matches the name wrapped in either quote character. Keep `found[-1]` as the oldest hit: one call keeps git's ordering, which is what makes the existing line still correct. The schema's name pattern is `^[a-z0-9][a-z0-9.-]*$`, so a name can contain a dot — a legacy record is named 4.2 — and a dot is a regex metacharacter, so escape the name before building the pattern rather than interpolating it raw. Then extend the docstring: it names three conditions under which it answers nothing and quoting was not among them, and after this change quoting is not one either, which is worth saying because the next reader will wonder." },
  { id = "system-row", desc = "In core/scripts/stale.py at :221, treat an empty per_member as unverifiable rather than letting knowledge.system_state return current over an empty map: `row = by_state.get(\"unverifiable\" if not per_member else knowledge.system_state(per_member))`. Do not add a fourth state to by_state and do not change knowledge.system_state — the empty case is the caller's to recognise, and unverifiable is the word the contract already has for a diff that could not run." },
