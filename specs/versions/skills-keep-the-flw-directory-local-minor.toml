name    = "skills-keep-the-flw-directory-local"
base    = "scripts-refuse-a-backwards-dependency"
summary = "Make the whole flw directory local by default rather than its two generated subdirectories, have a survey ask whether the team wants to share any of it, and untrack flw's own nine files so the default and the example agree."

approach = '''
Today a survey proposes two ignore lines. core/skills/flw-research/SKILL.md:201-204 shows
`.flw/reports/` and `.flw/knowledge/` and nothing else, and the reason given at :195-198 is
narrow: without them a review told to change nothing leaves ` M .flw/knowledge/…` and
`?? .flw/reports/` in the tree. That reason is about noise in a diff.

The reason the user gives is different and larger: more than one true picture of a system is
possible, so a local store is correct rather than a limitation. Two engineers on the same
service hold different pictures of it, each true for the work they do, and a store that has to
be merged forces one of them to be wrong. That applies to the knowledge store first, and it
applies to an extension and to a review team for the same reason — a convention one person
holds binding is not automatically the team's, and making it shared is a thing humans have to
agree to rather than a default a tool picks.

So the default inverts. A survey proposes the flw directory itself and then asks whether the
team wants any of config, extensions or review teams shared, saying that sharing them means
the team agreeing on what is in them. The question is the point: it is the moment the humans
align, and a default that shares silently removes it.

What this costs flw's own repository, measured at aa5959c with `git ls-files .flw/`. Nine
files are tracked: config.toml, four extensions/*.md, four reviews/*.toml.

The cost is concentrated in config.toml. It holds one key — a `setup` line that creates
`.venv/` and installs pytest and ruff — and all four of the contract's success_criteria.tests
invoke `.venv/bin/…`. The file's own comment records why it exists: "`flw test` on a new
checkout failed on both until this file existed". Untracked, a fresh clone has no venv and no
setup line, and core/scripts/run_tests.py:215 reads
`command = f"{setup} || exit {SETUP_FAILED}\\n{check.command}" if setup else check.command`, so
the four commands run bare and fail on a missing interpreter rather than reporting that
nothing ran.

Two documents carry that sentence and both become false, not one. README.md:122 is under
Requirements; docs/install.md:7 is the page a clone reads first and says "`flw test` inside
this checkout creates `.venv/` and installs pytest and ruff". Both get the setup line itself,
as one command a clone copies into its own config if it wants to run flw's checks.
docs/layout.md:19-20 also names `<project>/.flw/config.toml`, in the config-merge diagram,
and stays true: it describes where the file is read from, not that this repository ships one.

A third document contradicts the new default outright. docs/layout.md's "Tracked, or ignored"
section is the one place in the repository documenting which is which. Line 53 reads "Two
kinds of flw record are ignored here" and lists two paths, which becomes wrong and incomplete,
and line 60 reads "A team config is normally tracked, so a project copy of a shipped team
travels with the repo", which is the inverse of what this record decides.

What the four extensions actually cost, checked line by line rather than by one example. Of
the twelve statements across them, eleven survive untracking because tracked prose already
carries them: stdlib-only is at specs/current.toml:304, the 3.11 floor is a contract
assumption, the component-scope rule is at core/skills/flw-execute/SKILL.md:70 and
core/shared/autonomy.md:22 ("a path naming specific files does not extend to a sibling"), the
subcommand-at-spec-time rule is at core/skills/flw-spec/SKILL.md:267, mutation review is in
docs/measuring.md, and the rest are facts about this checkout rather than rules.

One does not. "Every module opens with a docstring saying why it exists, not what it does" at
.flw/extensions/shared.md:15 appears in no tracked file — `grep -rni "docstring saying
why|why it exists, not what" core/ docs/ README.md specs/` returns nothing but one dag task in
mark-what-is-spent. It is a rule about work not yet done, so it is what MUST BE and belongs in
the contract rather than in the store. It moves there.

Two statements are lost and deliberately not moved: that `flw` on PATH is a symlink into this
checkout, and the advice to run `.venv/bin/pytest -q tests/test_cli.py` directly when the
change is in the parser. Both are facts about one checkout rather than rules, and a clone can
find each in a few seconds.

What this is not. It does not change how extensions are read, how a store is resolved, or
where anything lives on disk — only what a survey proposes ignoring and what this repository
tracks. It does not make flw refuse a shared flw directory: a team that aligns and commits one
is doing the supported thing, which is why the survey asks instead of telling. It does not
touch `.flw/reviews/publish*.toml`, already ignored for its own reason. And it does not close
the open question about a committed store, which decision 4 explains.
'''

contract_edit = '''
Five edits.

1. In final_state.components, the component named "the skills", provides, replace the
   sentence reading:

     "It proposes the ignore lines alongside the config it writes wherever there is a file to
     put them in, and says where they go rather than assuming the store ends up ignored."

   with:

     "It proposes ignoring the flw directory itself alongside the config it writes, wherever
     there is a file to put the line in, and says where it goes rather than assuming the
     directory ends up ignored. It then asks whether the team wants any of the config, the
     extensions or the review teams shared instead, saying that sharing them means the team
     agreeing on what is in them — because more than one true picture of a system is possible,
     so local is the default and shared is a thing humans align on."

2. In the component named "the project surface", append to provides:

     "A reader is told that flw's per-project directory is local by default and that flw's own
     repository ignores all of it: both the install page and the requirements section carry
     the setup line a clone copies into its own config to run flw's declared checks, rather
     than pointing at a file the clone does not have, and the page that documents what is
     tracked says the flw directory is ignored whole and that sharing any part of it is a
     path a team un-ignores deliberately."

3. In the component named "validation and checks", append to implementation:

     "Every module under core/scripts/ and cli/ opens with a docstring saying why it exists
     rather than what it does."

4. In assumptions, in the entry beginning "Not every tracked path belongs to a component",
   replace:

     "specs/, .flw/ and pyproject.toml are read by flw and by hosts and delivered by no
     component"

   with:

     "specs/ and pyproject.toml are read by flw and by hosts and delivered by no component"

5. In open_questions, replace the entry beginning "What a committed knowledge store does to
   the staleness number" with:

     "What a committed knowledge store does to the staleness number, for a store a project
     has deliberately moved out of the flw directory with [knowledge] dir and then tracked.
     The default store is inside the flw directory and that directory is now ignored, so the
     question does not arise there. Outside it the exclusion does not reach: knowledge.py
     takes the flw directory's name and nothing else, so such a store's own writes still
     count as changes under the path its repository file describes. flw proposes against this
     and does not refuse it."

Nothing else changes. In particular the clause about the flw directory in "the knowledge
store" properties, under "Staleness is a git diff and never a judgment", is left exactly as
it stands: it describes the exclusion as implemented and stays true, and edit 5 is what
records where that exclusion stops.
'''

[[decisions]]
topic     = "how much of the flw directory is local by default"
options   = [
  "the knowledge store and the reports directory, as today",
  "the whole flw directory",
]
chosen    = "the whole flw directory"
rationale = '''
The user's reason is that more than one true picture of a system is possible. That is the
knowledge store's case directly, and it reaches an extension and a review team too: a
convention one engineer holds binding is not the team's until the team says so. The existing
reason for ignoring two subdirectories was narrower — keeping a review's writes out of the
user's diff — and it does not argue against ignoring the rest.
'''

[[decisions]]
topic     = "whether flw's own nine tracked files under .flw/ stay tracked"
options   = [
  "keep them tracked, as the worked example of a team that opted into sharing",
  "untrack them, so the default and this repository agree",
]
chosen    = "untrack them, so the default and this repository agree"
rationale = '''
The author chose this over keeping them with the consequence stated. A repository shipping a
default it does not follow teaches the opposite of the default. The cost is bounded and
measured: of the twelve statements across the four extensions, eleven are already in tracked
prose, one moves into the contract as edit 3, and two are facts about one checkout that a
clone can re-derive. config.toml is the only file anything reads mechanically, and edit 2
moves its one line into both documents that currently point at it.
'''

[[decisions]]
topic     = "where the venv setup line goes once .flw/config.toml is untracked"
options   = [
  "into the contract's success_criteria, beside the four commands that need it",
  "into README.md's Requirements section and docs/install.md, as a line a clone copies",
  "make flw test create the venv when a declared check names one",
]
chosen    = "into README.md's Requirements section and docs/install.md, as a line a clone copies"
rationale = '''
The contract records what is true when the work is done, and a venv bootstrap is a local
convenience rather than part of flw's definition of done — success_criteria has no setup field
and adding one would make every project's contract carry a machine detail. Having flw test
build a venv is refused by the contract already: "Stdlib only at runtime, and nothing is
installed to run a check". Both documents already tell a clone that this checkout creates
`.venv/`, so the line lands in the paragraphs a reader is standing in, and repairing only one
of them would fix the less-read of the two.
'''

[[decisions]]
topic     = "whether this record closes the open question about a committed knowledge store"
options   = [
  "close it: the store is not committed, so the question is answered",
  "make [knowledge] dir refuse a path outside the flw directory, closing it by refusal",
  "narrow it to the case the new default does not reach",
]
chosen    = "narrow it to the case the new default does not reach"
rationale = '''
Closing it outright was the first draft of this record and it was wrong. The decision to
ignore the flw directory answers the default location only. cli/flw.py:3568 resolves
`[knowledge] dir` to any relative path inside the root, and the staleness exclusion is keyed
on the flw directory's name alone — knowledge.py:344 takes `exclude: str`, :384 builds
`:(exclude)<name>`, and all nine callers pass `flw_dir_name()`. So a store at, say,
docs/knowledge/ that a project tracks still counts its own writes as changes under the path
its repository file describes, which is the question verbatim. knowledge.py:355-360 says as
much: the ignore-based approach "holds only while the project ignores its own store".

Refusing a path outside the flw directory would close it, but it narrows a surface the
contract already grants at properties[6] and breaks any project using it, for a case flw
already advises against — core/skills/flw-research/SKILL.md:210 follows `[knowledge] dir`
when proposing ignore lines. Narrowing the question costs nothing and keeps the contract
honest about where the exclusion stops.
'''
