base    = "opening-is-one-call"
name    = "claim-the-specs-directory"
summary = "specs/ joins the project surface's paths, because the directory recording what shipped was the one directory no component claimed"

approach = """
Found independently by three of the four lenses reviewing `opening-is-one-call`, and not
folded into it: the gap predates that version and would survive its revert.

Why it matters now rather than before. `flw-review` §3 hands a dispatched reviewer the
contract components whose `paths` intersect the scope, so a reviewer looking at `specs/`
receives no component at all — and `tests/test_cli.py` reads `specs/current.toml` off disk
as a fixture, which a reviewer scoped to `validation and checks` is never told.

Why `the project surface` and not another component. It already holds `plans/`, and a
contract is what a plan becomes: both are read by a person to learn what the project is,
neither is executed, and a reviewer given one should be given the other. `validation and
checks` was the alternative and is wrong — it holds the code that validates `specs/`, and
putting the validated directory beside its validator makes the component mean two things.
A component of its own was the third option and buys nothing: it would provide what `the
project surface` already provides.

No code changes and no check accompanies this. What it alters is which component a
`paths` intersection returns, and flw's suite cannot dispatch a reviewer — the gap
`success_criteria` already records.
"""

contract_edit = """
In `final_state.components`, component **the project surface**:

`paths` — add "specs/" after "plans/".
"""

[[decisions]]
topic     = "which component's paths gain specs/"
options   = ["the project surface, beside plans/", "validation and checks, beside the code that validates it", "a component of its own"]
chosen    = "the project surface, beside plans/"
rationale = "A contract is what a plan becomes, and the project surface already holds plans/ — both are read by a person to learn what the project is and neither is executed. Putting specs/ beside its validator would make validation and checks mean both the checker and the checked. A component of its own would provide nothing the project surface does not already provide, and a component that provides nothing is a file list."
