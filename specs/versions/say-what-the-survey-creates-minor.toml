tasks = [
  { id = "compose", desc = "In core/skills/flw-research/SKILL.md at :116-121, remove the promotion of docker-compose.yml, k8s manifests and .env.example ahead of everything else for a multi-repo system, and the sentence calling a compose file the machine-readable system diagram. Across the three field-test checkouts that read returned one file and no topology, because a library does not ship the topology of a system someone builds with it. Keep the last two sentences of the paragraph, about reading each README and then discounting it, which are unaffected and still right. Leave the compose file in the ordinary first-read list in step 2 if it is not there already." },
  { id = "churn", desc = "In the same file at :149-152, bound the cross-repo churn variant rather than deleting the idea: same-day commits in two repositories indicate a seam change only where somebody releases them together, and on independently released upstreams the rate is coincidence. The shell loop can go, which is most of the bytes. Keep the paragraph's first half, which warns that churn is not a ranking substitute and is often inverted, since that is the part the field test did not dispute.", depends_on = ["compose"] },
  { id = "budget", desc = "Run .venv/bin/python core/scripts/budget.py and paste its report. The file was 20,853 of 21,000 before this record and skills-move-minority-sections moves 4,097 bytes of it into the reference file, so the report is the evidence that this record landed in the headroom that record created rather than over the ceiling. If it is over, that record has not landed and this one should not have run: say so rather than cutting tasks to fit.", depends_on = ["churn", "decorators", "ignore"] },
  { id = "verify", desc = "flw validate, then flw test --no-stream. Then run flw doctor, which reports whether an extension is read by an installed skill and is the one check that would notice a skill file broken by an edit. Say in the report that nothing was re-run against the ASGI fixture, because this record changes instructions rather than code and the fixture cannot tell whether an instruction is better.", depends_on = ["budget"] },
